<!doctype html>
<html lang="en" data-palette="b">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graveyard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Shantell+Sans:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Load order is load-bearing: karakuli.css assumes tokens.css is present. -->
  <link rel="stylesheet" href="vendor/karakuli/tokens.css" />
  <link rel="stylesheet" href="vendor/karakuli/karakuli.css" />
  <link rel="stylesheet" href="vendor/karakuli/boil.css" />
  <link rel="stylesheet" href="vendor/karakuli/anim.css" />
  <link rel="stylesheet" href="css/palettes.css" />
  <link rel="stylesheet" href="css/graveyard.css" />

  <!-- boil.js injects its filter defs on DOMContentLoaded. Every script here
       is an ES module, so this page must be served over http — file:// fails
       silently and the boil, entrances and sound simply never run. -->
  <script type="module" src="vendor/karakuli/boil.js"></script>
</head>
<body>
  <main class="gy-app">
    <section id="scene"></section>
    <aside id="epitaph"></aside>
  </main>

  <script type="module">
    import { loadDoodles } from './js/doodles.js';
    import { layOutGraveyard } from './js/plots.js';
    import { mountScene } from './js/scene.js';
    import { mountEpitaph } from './js/epitaph.js';
    import { mountCandle } from './js/candle.js';
    import { mountAutopsyReader } from './js/autopsy.js';

    const MOTIFS = [
      'headstone-round', 'headstone-cross', 'obelisk', 'urn', 'mound',
      'cairn', 'stake',
      'fence-post', 'lantern', 'candle', 'candle-out', 'match', 'matchbox', 'flame',
      'moon', 'star', 'cloud', 'spark', 'tree', 'flower-daisy', 'leaf',
      'sprout', 'arrow-right', 'baton-sleep', 'shadow-blob',
    ];

    const projects = await (await fetch('./data/projects.json')).json();
    await loadDoodles(MOTIFS, './doodles/');

    const epitaph = mountEpitaph(document.getElementById('epitaph'));

    /* Playful register: the kit's default 'calm' dial swallows tap cues
       entirely, and a graveyard you click through needs the tap. */
    let krk = null;
    let CUES = null;
    try {
      const sound = await import('./vendor/karakuli/sound.js');
      krk = sound.initKarakuliSound({ energy: 'playful' });
      CUES = sound.KRK_CUES;
    } catch {
      /* uisfx unreachable — the page stays silent and fully usable. */
    }

    const sceneEl = document.getElementById('scene');
    let scene = null;
    let editor = null;
    let selected = null;

    /* Showing a grave and rebuilding the yard are separate on purpose: an edit
       redraws the scene while the form stays open in the panel, so rebuild()
       must never touch the panel. */
    function show(project) {
      selected = project?.slug ?? null;
      if (!project) return;
      epitaph.show(project);
      editor?.setSelected(project);
    }

    function rebuild() {
      /* The scene about to be replaced still holds observers and a vigil
         subscription; the DOM they watch is a moment from being thrown away. */
      scene?.destroy();
      const years = projects.map((p) => String(p.died).slice(0, 4)).sort();
      scene = mountScene(sceneEl, layOutGraveyard(projects), {
        heading: {
          title: 'Graveyard',
          meta: `${projects.length} projects · ${years[0]}–${years[years.length - 1]}`,
        },
        onSelect: (project) => {
          show(project);
          krk?.play(CUES.tap);
        },
      });
      /* mountScene clears the frame, so the candle has to go back on after it. */
      mountCandle(sceneEl);
      if (selected && projects.some((p) => p.slug === selected)) scene.select(selected);
      else selected = null;
    }

    rebuild();

    /* The panel throws its contents away on every show(), so the listeners live
       on the container that survives it. A cue when the match catches and one
       when the candle takes — and nothing on a failed strike, which would turn
       the quietest moment on the site into a rattle. */
    const panelEl = document.getElementById('epitaph');
    panelEl.addEventListener('gy:strike', () => krk?.play(CUES.pick));
    panelEl.addEventListener('gy:lit', () => krk?.play(CUES.moment));

    /* The reader lives on <body>: rebuild() clears the scene and every show()
       throws the panel away, and an open report must survive both. */
    const reader = mountAutopsyReader();
    panelEl.addEventListener('gy:autopsy', (e) => {
      reader.open(e.detail, e.target);
      krk?.play(CUES.tap);
    });

    /* The editor exists only behind ?edit — a visitor never sees an affordance,
       and finding the URL gets them nothing without a token. */
    if (new URLSearchParams(location.search).has('edit')) {
      const { mountEditor } = await import('./js/editor.js');
      editor = mountEditor(document.getElementById('epitaph'), {
        projects, rebuild, reselect: show,
      });
    }
  </script>
</body>
</html>
