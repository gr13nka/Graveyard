<!doctype html>
<html lang="en" data-palette="b">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graveyard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Shantell+Sans:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Load order is load-bearing: karakuli.css assumes tokens.css is present. -->
  <link rel="stylesheet" href="vendor/karakuli/tokens.css" />
  <link rel="stylesheet" href="vendor/karakuli/karakuli.css" />
  <link rel="stylesheet" href="vendor/karakuli/boil.css" />
  <link rel="stylesheet" href="vendor/karakuli/anim.css" />
  <link rel="stylesheet" href="css/palettes.css" />
  <link rel="stylesheet" href="css/graveyard.css" />

  <!-- boil.js injects its filter defs on DOMContentLoaded. Every script here
       is an ES module, so this page must be served over http — file:// fails
       silently and the boil, entrances and sound simply never run. -->
  <script type="module" src="vendor/karakuli/boil.js"></script>
</head>
<body>
  <main class="gy-app">
    <section id="scene"></section>
    <aside id="epitaph"></aside>
  </main>

  <script type="module">
    import { loadDoodles } from './js/doodles.js';
    import { layOutGraveyard } from './js/plots.js';
    import { mountScene } from './js/scene.js';
    import { mountEpitaph } from './js/epitaph.js';
    import { mountCandle } from './js/candle.js';

    const MOTIFS = [
      'headstone-round', 'headstone-cross', 'obelisk', 'urn', 'mound',
      'fence-post', 'lantern', 'candle', 'glow', 'light-pool',
      'moon', 'star', 'cloud', 'spark', 'tree', 'flower-daisy', 'leaf',
      'sprout', 'arrow-right', 'baton-sleep', 'shadow-blob',
    ];

    const projects = await (await fetch('./data/projects.json')).json();
    await loadDoodles(MOTIFS, './doodles/');

    const years = projects.map((p) => String(p.died).slice(0, 4)).sort();
    const epitaph = mountEpitaph(document.getElementById('epitaph'));

    /* Playful register: the kit's default 'calm' dial swallows tap cues
       entirely, and a graveyard you click through needs the tap. */
    let krk = null;
    let CUES = null;
    try {
      const sound = await import('./vendor/karakuli/sound.js');
      krk = sound.initKarakuliSound({ energy: 'playful' });
      CUES = sound.KRK_CUES;
    } catch {
      /* uisfx unreachable — the page stays silent and fully usable. */
    }

    const sceneEl = document.getElementById('scene');

    mountScene(sceneEl, layOutGraveyard(projects), {
      heading: {
        title: 'Graveyard',
        meta: `${projects.length} projects · ${years[0]}–${years[years.length - 1]}`,
      },
      onSelect: (project) => {
        epitaph.show(project);
        krk?.play(CUES.tap);
      },
    });

    mountCandle(sceneEl);
  </script>
</body>
</html>
